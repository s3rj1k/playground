name: Kubernetes Image Builder (mkosi)

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - ".github/workflows/build-k8s-mkosi.yaml"
  #     - "vms/efi/mkosi/debian/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  MKOSI_IMAGE: debian-trixie

jobs:
  build-and-push:
    strategy:
      matrix:
        include:
          - arch: amd64
            mkosi_arch: x86-64
            runner: ubuntu-24.04
            profile: k8s
          - arch: arm64
            mkosi_arch: arm64
            runner: ubuntu-24.04-arm
            profile: k8s
          - arch: arm64-vz
            mkosi_arch: arm64
            runner: ubuntu-24.04-arm
            profile: k8s,vz
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pipx
        run: pip install pipx pefile

      - name: Install mkosi
        run: |
          sudo pip install git+https://github.com/systemd/mkosi.git
          mkosi --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debian-archive-keyring \
            mtools \
            python3-pefile \
            systemd-boot

      - name: Build OS Image
        shell: bash
        working-directory: vms/efi/mkosi/debian
        run: |
          sudo mkosi --force --profile ${{ matrix.profile }} --architecture=${{ matrix.mkosi_arch }} \
            --tools-tree=default \
            --tools-tree-distribution=debian \
            --tools-tree-release=trixie \
            build
          sudo chmod 0666 disk.vm.raw

          gzip --keep disk.vm.raw

          echo "ARTIFACT_TAG=$(cat kubelet.version | tr -d '\n')" >> $GITHUB_ENV

      # arm64-vz ships as ASIF instead, converted and pushed by convert-and-push-asif on macos-26
      - name: Upload raw disk artifact
        if: matrix.arch == 'arm64-vz'
        uses: actions/upload-artifact@v7
        with:
          name: disk-raw-arm64-vz
          path: |
            vms/efi/mkosi/debian/disk.vm.raw.gz
            vms/efi/mkosi/debian/kubelet.version
          retention-days: 1

      - name: Log in to Container Registry
        if: matrix.arch != 'arm64-vz'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to registry
        if: matrix.arch != 'arm64-vz'
        shell: bash
        working-directory: vms/efi/mkosi/debian
        run: |
          oras version

          export DIGEST="$(sha256sum disk.vm.raw.gz | awk '{print $1}')"
          export TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          mkdir -p image-builder/images/capi/output/ && \
            mv -v disk.vm.raw.gz image-builder/images/capi/output/${{ env.MKOSI_IMAGE }}-kube-${{ env.ARTIFACT_TAG }}-${{ matrix.arch }}.gz

          oras push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.MKOSI_IMAGE }}-k8s:${{ env.ARTIFACT_TAG }}-${{ matrix.arch }}.gz \
            --annotation "org.opencontainers.image.authors=${{ github.actor }}" \
            --annotation "org.opencontainers.image.created=${TIMESTAMP}" \
            --annotation "org.opencontainers.image.title=${{ env.MKOSI_IMAGE }}-k8s" \
            --annotation "org.opencontainers.image.version=${{ env.ARTIFACT_TAG }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.base.digest=${DIGEST}" \
            --artifact-type application/vnd.acme.rocket.config image-builder/images/capi/output/${{ env.MKOSI_IMAGE }}-kube-${{ env.ARTIFACT_TAG }}-${{ matrix.arch }}.gz

      - name: Write summary
        if: matrix.arch != 'arm64-vz'
        shell: bash
        working-directory: vms/efi/mkosi/debian
        run: |
          echo "## Image pull using ORAS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "oras pull ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.MKOSI_IMAGE }}-k8s:${{ env.ARTIFACT_TAG }}-${{ matrix.arch }}.gz" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## CAPI preflight (required before kubeadm)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pass \`ignorePreflightErrors\` in both \`initConfiguration\` and \`joinConfiguration\` to bypass Debian-specific preflight failures:" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo "nodeRegistration:" >> $GITHUB_STEP_SUMMARY
          echo "  criSocket: unix:///run/containerd/containerd.sock" >> $GITHUB_STEP_SUMMARY
          echo "ignorePreflightErrors:" >> $GITHUB_STEP_SUMMARY
          echo "  - SystemVerification" >> $GITHUB_STEP_SUMMARY
          echo "  - FileContent--proc-sys-net-bridge-bridge-nf-call-iptables" >> $GITHUB_STEP_SUMMARY
          echo "  - FileContent--proc-sys-net-bridge-bridge-nf-call-ip6tables" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  convert-and-push-asif:
    needs: build-and-push
    runs-on: macos-26

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download raw disk artifact
        uses: actions/download-artifact@v8
        with:
          name: disk-raw-arm64-vz
          path: vms/efi/mkosi/debian

      - name: Convert to ASIF
        shell: bash
        working-directory: vms/efi/mkosi/debian
        run: |
          gunzip disk.vm.raw.gz
          diskutil image create --verbose from disk.vm.raw --format ASIF disk.vm.asif
          diskutil image resize disk.vm.asif -s 200Gi
          rm -f disk.vm.raw
          gzip disk.vm.asif

          echo "ARTIFACT_TAG=$(cat kubelet.version | tr -d '\n')" >> $GITHUB_ENV

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to registry
        shell: bash
        working-directory: vms/efi/mkosi/debian
        run: |
          oras version

          export DIGEST="$(sha256sum disk.vm.asif.gz | awk '{print $1}')"
          export TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          mv -v disk.vm.asif.gz ${{ env.MKOSI_IMAGE }}-kube-${{ env.ARTIFACT_TAG }}-arm64-vz.asif.gz

          oras push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.MKOSI_IMAGE }}-k8s:${{ env.ARTIFACT_TAG }}-arm64-vz.asif.gz \
            --annotation "org.opencontainers.image.authors=${{ github.actor }}" \
            --annotation "org.opencontainers.image.created=${TIMESTAMP}" \
            --annotation "org.opencontainers.image.title=${{ env.MKOSI_IMAGE }}-k8s" \
            --annotation "org.opencontainers.image.version=${{ env.ARTIFACT_TAG }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.base.digest=${DIGEST}" \
            --artifact-type application/vnd.acme.rocket.config ${{ env.MKOSI_IMAGE }}-kube-${{ env.ARTIFACT_TAG }}-arm64-vz.asif.gz

      - name: Write summary
        shell: bash
        run: |
          echo "## Image pull using ORAS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "oras pull ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.MKOSI_IMAGE }}-k8s:${{ env.ARTIFACT_TAG }}-arm64-vz.asif.gz" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## CAPI preflight (required before kubeadm)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pass \`ignorePreflightErrors\` in both \`initConfiguration\` and \`joinConfiguration\` to bypass Debian-specific preflight failures:" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo "nodeRegistration:" >> $GITHUB_STEP_SUMMARY
          echo "  criSocket: unix:///run/containerd/containerd.sock" >> $GITHUB_STEP_SUMMARY
          echo "ignorePreflightErrors:" >> $GITHUB_STEP_SUMMARY
          echo "  - SystemVerification" >> $GITHUB_STEP_SUMMARY
          echo "  - FileContent--proc-sys-net-bridge-bridge-nf-call-iptables" >> $GITHUB_STEP_SUMMARY
          echo "  - FileContent--proc-sys-net-bridge-bridge-nf-call-ip6tables" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
