[Content]
Packages=
	containerd.io
	docker-buildx-plugin
	docker-ce
	docker-ce-cli
	docker-compose-plugin
	kubectl
	netbird

[Build]
# mkosi runs the package manager from outside the image, so profile-specific apt
# sources (e.g. the Kubernetes and NetBird repos) must be exposed to the sandbox as
# well, not just the skeleton/buildroot. See mkosi(1) SandboxTrees=.
SandboxTrees=
    mkosi.skeleton
    ../../mkosi.sandbox
