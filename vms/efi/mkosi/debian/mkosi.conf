[Distribution]
Distribution=debian
Release=trixie
Repositories=non-free-firmware

[Output]
Format=disk
Output=disk.vm

[Build]
WithNetwork=yes
SandboxTrees=mkosi.sandbox

[Content]
CleanPackageMetadata=no

Hostname=vm
Keymap=us
Locale=C
Timezone=UTC

WithDocs=no
WithRecommends=no

Packages=
	apt
	apt-transport-https
	bash
	btrfs-progs
	ca-certificates
	cloud-guest-utils
	cloud-init
	cloud-initramfs-growroot
	curl
	dbus-broker
	diffutils
	dosfstools
	e2fsprogs
	ebtables
	ethtool
	gawk
	git
	git-lfs
	gnupg
	grep
	gzip
	hwloc-nox
	initramfs-tools
	iproute2
	iptables
	iputils-ping
	jq
	kmod
	less
	libpam-systemd
	firmware-linux-nonfree
	linux-perf
	locales
	login
	man-db
	mtools
	multipath-tools
	nano
	net-tools
	nftables
	openssh-client
	openssh-server
	openssl
	pciutils
	pipx
	polkitd
	python3-jinja2
	python3-pefile
	python3-pip
	python3-venv
	qemu-guest-agent
	ripgrep
	sed
	shim-signed
	socat
	ssh-import-id
	strace
	sudo
	systemd
	systemd-coredump
	systemd-repart
	systemd-resolved
	systemd-sysv
	systemd-timesyncd
	systemd-ukify
	tar
	tzdata
	udev
	unattended-upgrades
	vim-tiny
	wget
	wireguard
	wireguard-tools
	zstd

RemovePackages=
	libnss-resolve

# [ -d /sys/firmware/efi ] && echo UEFI || echo BIOS
Bootable=yes

[Validation]
Checksum=yes

[Runtime]
CPUs=2
RAM=6G
VSock=yes
RuntimeSize=50G
QemuArgs=-nographic
